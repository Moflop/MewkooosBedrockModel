plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.+'
    id "com.modrinth.minotaur" version "2.8.7"
    id 'me.champeau.jmh' version '0.7.2'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
archivesBaseName = 'mewkooos_bedrock_model'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Explicitly selected integration runs keep compile-time compatibility APIs while
// varying the actual client mods. Normal development and publication are unchanged.
def clientTestControl = providers.gradleProperty('clientTestControl').map { it.toBoolean() }.getOrElse(false)
def clientTestEngineFix = providers.gradleProperty('clientTestEngineFix').map { it.toBoolean() }.getOrElse(false)
def clientTestProfile = providers.gradleProperty('clientTestProfile').orNull ?: (clientTestControl ? 'vanilla' : null)
def clientTestWorld = providers.gradleProperty('clientTestWorld').getOrElse('sbm-client-test')
def clientTestDirectory = clientTestProfile == null ? null :
        (clientTestControl ? "control-${clientTestProfile}" : clientTestProfile) +
                (clientTestEngineFix ? '-engine-fix' : '')
def clientTestProfiles = ['vanilla', 'ar', 'sodium', 'sodium-ar', 'embeddium', 'embeddium-ar', 'sodium-ar-iris']
if (clientTestProfile != null && !clientTestProfiles.contains(clientTestProfile)) {
    throw new GradleException("Unknown clientTestProfile '${clientTestProfile}': ${clientTestProfiles.join(', ')}")
}

// A separately compiled control mod lets integration runs exclude the library,
// its mixins and its test harness entirely while keeping the chosen renderers.
if (clientTestControl) {
    sourceSets.create('engineTest')
    sourceSets.engineTest.java.srcDir 'src/clientDiagnostics/java'
    configurations.engineTestCompileClasspath.extendsFrom configurations.compileClasspath
    configurations.engineTestRuntimeClasspath.extendsFrom configurations.runtimeClasspath
}
sourceSets.test.java.srcDir 'src/clientDiagnostics/java'

// This optional engine compatibility mod is compiled/packaged independently.
// It is never part of the library's main output, normal JAR or publication.
sourceSets.create('enginePatch')
configurations.enginePatchCompileClasspath.extendsFrom configurations.compileClasspath
configurations.enginePatchRuntimeClasspath.extendsFrom configurations.runtimeClasspath

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            if (clientTestControl) sourceSet = sourceSets.engineTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (clientTestProfile != null) {
                gameDirectory = file("build/client-environment-tests/${clientTestDirectory}/game")
                programArguments.addAll '--quickPlaySingleplayer', clientTestWorld
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }


        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }


        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        if (clientTestControl) {
            sbm_engine_control {
                sourceSet(sourceSets.engineTest)
            }
        } else {
            "${mod_id}" {
                sourceSet(sourceSets.main)
                sourceSet(sourceSets.test)
            }
        }
        if (clientTestEngineFix) {
            sbm_chunk_unload_fix {
                sourceSet(sourceSets.enginePatch)
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime

    // 自定义一个 minecraftLibrary，方便引入需要 jarJar 的库
    mcLib
    implementation {
        extendsFrom mcLib
    }
    additionalRuntimeClasspath {
        extendsFrom mcLib
    }

    // 让测试编译期能访问 Minecraft / NeoForge 等主模块的编译依赖
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath

    // Resolves the just-published coordinates for the downstream API
    // compilation check below. Keeping this separate avoids polluting the
    // normal test/runtime classpaths with a self dependency.
    downstreamCompile
}

repositories {
    mavenLocal()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    mavenCentral()
}

// Keep the embedded dependency graph and published POM in sync. Minecraft
// supplies these libraries, including its strictly pinned fastutil version.
def minecraftProvidedMaeModules = [
        [group: 'com.google.code.gson', module: 'gson'],
        [group: 'com.google.code.findbugs', module: 'jsr305'],
        [group: 'it.unimi.dsi', module: 'fastutil'],
        [group: 'org.joml', module: 'joml']
]

dependencies {
    add(clientTestProfile == null ? 'implementation' : 'compileOnly',
            "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge")
    compileOnly "maven.modrinth:embeddium:1.0.11+mc1.21.1-neoforge"
    mcLib jarJar("com.maydaymemory:mae:1.1.4") {
        minecraftProvidedMaeModules.each { provided ->
            exclude group: provided.group, module: provided.module
        }
    }

    add(clientTestProfile == null ? 'implementation' : 'compileOnly',
            "curse.maven:accelerated-rendering-1314021:8437381")
    api 'org.ow2.asm:asm:9.8'

    // 测试用兼容模组：发布时仍保持可选依赖。
    if (clientTestProfile == null) {
        runtimeOnly "curse.maven:configured-457570:7276577"
        localRuntime "curse.maven:playeranimator-658587:7389814"
        localRuntime "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
    } else {
        if (clientTestProfile.startsWith('sodium')) {
            runtimeOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
        }
        if (clientTestProfile.startsWith('embeddium')) {
            runtimeOnly "maven.modrinth:embeddium:1.0.11+mc1.21.1-neoforge"
        }
        if (clientTestProfile == 'ar' || clientTestProfile.contains('-ar')) {
            runtimeOnly "curse.maven:accelerated-rendering-1314021:8437381"
        }
        if (clientTestProfile.endsWith('-iris')) {
            localRuntime "maven.modrinth:iris:1.8.12+1.21.1-neoforge"
        }
    }

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation "org.joml:joml:1.10.5"

    downstreamCompile "${mod_group_id}:${archivesBaseName}:${mod_version}"

    // JMH: mocha 原版 (javassist) 用于性能对比
    jmhImplementation 'team.unnamed:mocha:3.0.1'
}

// testRuntimeClasspath also inherits compileClasspath in this project. Excluding
// absent renderers here prevents compileOnly compatibility JARs reappearing in
// an integration client's runtime through the test source set.
if (clientTestProfile != null) {
    configurations.matching {
        it.name in ['runtimeClasspath', 'testRuntimeClasspath', 'additionalRuntimeClasspath']
    }.configureEach {
        if (!clientTestProfile.startsWith('sodium')) exclude group: 'maven.modrinth', module: 'sodium'
        if (!clientTestProfile.startsWith('embeddium')) exclude group: 'maven.modrinth', module: 'embeddium'
        if (!(clientTestProfile == 'ar' || clientTestProfile.contains('-ar'))) {
            exclude group: 'curse.maven', module: 'accelerated-rendering-1314021'
        }
        if (!clientTestProfile.endsWith('-iris')) exclude group: 'maven.modrinth', module: 'iris'
    }
    def runtimeReport = tasks.register('writeClientTestRuntime') {
        def selectedClasspath = clientTestControl ? configurations.engineTestRuntimeClasspath : configurations.runtimeClasspath
        def reportFile = layout.buildDirectory.file("client-environment-tests/${clientTestDirectory}/resolved-runtime.json")
        outputs.file(reportFile)
        inputs.files(selectedClasspath)
        inputs.property('engineFix', clientTestEngineFix)
        inputs.property('profile', clientTestProfile)
        inputs.property('control', clientTestControl)
        inputs.property('world', clientTestWorld)
        doLast {
            def artifacts = selectedClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                [coordinate: it.moduleVersion.id.toString(), file: it.file.absolutePath]
            }.sort { it.coordinate }
            def report = [profile: clientTestProfile, control: clientTestControl, engineFix: clientTestEngineFix,
                          world: clientTestWorld, artifacts: artifacts]
            reportFile.get().asFile.parentFile.mkdirs()
            reportFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report))
        }
    }
    tasks.named('runClient').configure { dependsOn runtimeReport }
}

// 用于 neoforge.mods 里替换那一堆 ${xxxx}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// 生成 manifest 内容，用于填充版本信息等内容
jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    exclude 'example/**'
    exclude 'assets/example/**'
    exclude 'data/example/**'
}

tasks.register('engineUnloadFixJar', Jar) {
    group = 'build'
    description = 'Builds the optional, independent Minecraft 1.21.1 / NeoForge 21.1 chunk-unload compatibility mod.'
    from sourceSets.enginePatch.output
    archiveBaseName = 'sbm-chunk-unload-fix'
    archiveVersion = '1.0.0+mc1.21.1'
    archiveClassifier = ''
}

// 让 idea 主动下载前置库的源码和 Javadoc
// 新版本 idea 默认不会下载这两个，这虽然加快了构建速度，但是不方便调试
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 必须，编码需要显式指定为 UTF
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

sourceSets {
    downstream {
        java.srcDir 'src/test/downstream'
    }
}

// Compile a tiny consumer against the published Maven coordinates. This
// catches public API signatures whose third-party types are absent from POM.
tasks.register('compileDownstreamApi', JavaCompile) {
    dependsOn publishToMavenLocal
    source = sourceSets.downstream.java
    classpath = configurations.downstreamCompile
    destinationDirectory = layout.buildDirectory.dir('downstream/classes')
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.register('verifyDownstreamRuntime', Exec) {
    group = 'verification'
    description = 'Compiles and resolves a real NeoForge consumer of the published library.'
    dependsOn publishToMavenLocal
    workingDir projectDir
    if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows')) {
        commandLine 'cmd.exe', '/d', '/c', 'gradlew.bat'
    } else {
        commandLine file('gradlew').absolutePath
    }
    args '--no-daemon', '--project-dir', file('src/test/downstream-runtime').absolutePath,
            "-PlibraryVersion=${mod_version}", 'compileJava', 'verifyRuntime'
}

jmh {
    zip64 = true
    jmhVersion = '1.37'
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = mod_id
    versionName = "${mod_id}-${version}"
    versionNumber = mod_version
    uploadFile = "${layout.buildDirectory.get()}/libs/${mod_id}-${version}.jar"
    additionalFiles = ["${layout.buildDirectory.get()}/libs/${mod_id}-${version}-sources.jar"]
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    //debugMode = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = archivesBaseName
            version = project.version

            // 仅发布最终 Mod JAR 与源码包；不要从 Java component 导出开发/运行依赖。
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')

            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
                // Mae types appear in the public animation/model API. It is
                // compile-time visible to consumers; the runtime copy remains
                // embedded in this mod JAR through Jar-in-Jar.
                withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    def maeDependency = dependenciesNode.appendNode('dependency')
                    maeDependency.appendNode('groupId', 'com.maydaymemory')
                    maeDependency.appendNode('artifactId', 'mae')
                    maeDependency.appendNode('version', '1.1.4')
                    // Keep this as a normal compile dependency: provided is
                    // intentionally non-transitive and would recreate the
                    // downstream "cannot access Pose" failure.
                    maeDependency.appendNode('scope', 'compile')
                    def exclusionsNode = maeDependency.appendNode('exclusions')
                    minecraftProvidedMaeModules.each { provided ->
                        def exclusionNode = exclusionsNode.appendNode('exclusion')
                        exclusionNode.appendNode('groupId', provided.group)
                        exclusionNode.appendNode('artifactId', provided.module)
                    }
                }
            }
        }
    }
}

tasks.register("runWithRenderDoc", Exec) {
    commandLine = [
            "D:\\tools\\RenderDoc_1.44_64\\renderdoccmd.exe",
            "capture",
            "--opt-hook-children",
            "--wait-for-exit",
            "--working-dir",
            projectDir.absolutePath,

            "C:\\Windows\\System32\\cmd.exe",
            "/c",
            file("gradlew.bat").absolutePath,
            "--no-daemon",
            "runClient"
    ]

    doFirst {
        println "=== RenderDoc gradlew command ==="
        println commandLine.collect {
            it.toString().contains(" ") ? "\"${it}\"" : it
        }.join(" ")
        println "================================="
    }
}
